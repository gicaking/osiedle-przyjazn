name = "tablica-przyjazn"
main = "src/index.js"
compatibility_date = "2026-07-01"
workers_dev = false

routes = [
  { pattern = "api.osiedleprzyjazn.waw.pl", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "tablica_przyjazn"
database_id = "e495707c-8f54-4cb6-b605-b34b97ca0b01"

# Workers AI: tryb zapasowy bota redakcji, gdy nie ma ANTHROPIC_API_KEY
[ai]
binding = "AI"

# Pliki edytora wczytywane jako tekst
rules = [ { type = "Text", globs = ["**/*.html", "**/*.txt"] } ]
