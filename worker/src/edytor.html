<!DOCTYPE html>
<html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edytor strony</title><meta name="robots" content="noindex">
<style>
  body{font-family:system-ui,sans-serif;background:#F3F4EE;color:#24322B;max-width:560px;margin:0 auto;padding:40px 20px;line-height:1.5}
  h1{font-size:1.5rem;margin:0 0 6px}
  input{width:100%;padding:10px;border:1.5px solid #24322B;border-radius:8px;font-size:1rem;box-sizing:border-box;background:#FBFBF7}
  button{background:#F2C94C;color:#24322B;border:2px solid #24322B;border-radius:10px;padding:9px 16px;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:3px 3px 0 #24322B;margin-top:12px}
  .blad{color:#BF4630;font-weight:600;margin-top:10px}
  p.pod{opacity:.7}
</style></head><body>
<h1>✍️ Edytor strony osiedleprzyjazn.waw.pl</h1>
<p class="pod">Za chwilę otworzy się strona w trybie edycji. Klikasz tekst i poprawiasz go na miejscu. Nic nie zmienia się publicznie, dopóki nie klikniesz Zapisz i opublikuj.</p>
<label for="klucz">Klucz redakcji</label>
<input id="klucz" type="password" placeholder="wklej klucz">
<button id="start">Otwórz edytor</button>
<p id="info"></p>
<script>
  const pole = document.getElementById('klucz');
  pole.value = localStorage.getItem('klucz_redakcji') || localStorage.getItem('klucz_gospodarza') || '';
  async function start(){
    const klucz = pole.value.trim();
    if (!klucz) { document.getElementById('info').className = 'blad'; document.getElementById('info').textContent = 'Wklej klucz.'; return; }
    localStorage.setItem('klucz_redakcji', klucz);
    document.getElementById('info').className = ''; document.getElementById('info').textContent = 'Pobieram aktualną stronę…';
    try {
      const r = await fetch(location.origin + '/redakcja/zrodlo', { headers: { 'X-Admin-Key': klucz } });
      const d = await r.json();
      if (!r.ok || d.blad) throw new Error(d.blad || ('Błąd ' + r.status));
      let html = d.html;
      html = html.replace(/<head>/i, '<head><base href="https://osiedleprzyjazn.waw.pl/" data-edytor="base">');
      html = html.replace(/<script(?![^>]*type=["']application\/ld\+json["'])([^>]*)>/gi, '<script type="text/plain" data-edytor-wylaczony="1"$1>');
      html = html.replace(/<\/body>/i, '<script data-edytor="skrypt" src="' + location.origin + '/edytor.js"><\/script></body>');
      document.open(); document.write(html); document.close();
    } catch (e) { document.getElementById('info').className = 'blad'; document.getElementById('info').textContent = e.message; }
  }
  document.getElementById('start').onclick = start;
  pole.addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
  if (pole.value && new URLSearchParams(location.search).get('auto') === '1') start();
</script>
</body></html>
